name: Publish newsletter from issue

# 루틴 세션은 글만 써서 이슈를 열고, 발행은 전적으로 이 워크플로가 합니다.
# 저장소를 clone 하거나 커밋 권한을 쓰는 주체는 CI 한 곳으로 모읍니다.

on:
  issues:
    types: [opened, reopened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: newsletter-publish
  cancel-in-progress: false

jobs:
  publish:
    # 제목 규약과 작성자를 모두 만족할 때만 동작합니다.
    # 공개 저장소에서는 누구나 이슈를 열 수 있으므로 작성자 검증이 필수입니다.
    if: >-
      startsWith(github.event.issue.title, 'newsletter:') &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 이슈 본문을 파일로 저장
        env:
          BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$BODY" > "${RUNNER_TEMP}/issue-body.md"

      - name: 변환 및 검증
        id: convert
        env:
          TITLE: ${{ github.event.issue.title }}
        run: python3 tools/newsletter_publish.py "$TITLE" "${RUNNER_TEMP}/issue-body.md"

      - name: 빌드 검증
        run: |
          npm ci
          npm run build

      - name: 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/newsletter public/newsletter-history.json
          git commit -m "newsletter: ${{ steps.convert.outputs.date }} 아침 브리핑 (issue #${{ github.event.issue.number }})"
          git push origin HEAD:main

      - name: 발행 완료 보고
        uses: actions/github-script@v7
        with:
          script: |
            const date = '${{ steps.convert.outputs.date }}';
            const chars = '${{ steps.convert.outputs.chars }}';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: [
                `발행했어요 → https://iruki.dev/newsletter/${date}`,
                '',
                `- 본문 ${chars}자`,
                `- \`content/newsletter/${date}.md\``,
                '',
                '---',
                '_Generated by [Claude Code](https://claude.ai/code)_',
              ].join('\n'),
            });
            await github.rest.issues.update({
              ...context.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed',
            });

      - name: 실패 사유 보고
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: [
                '발행하지 못했어요. 이슈는 열어 둘 테니 본문을 고치면 다시 시도합니다.',
                '',
                `실패 로그: ${run}`,
                '',
                '자주 나오는 원인: frontmatter 누락, `pubDate`와 제목 날짜 불일치, 본문 분량 하한 미달, 같은 날짜 파일이 이미 존재.',
                '',
                '---',
                '_Generated by [Claude Code](https://claude.ai/code)_',
              ].join('\n'),
            });
